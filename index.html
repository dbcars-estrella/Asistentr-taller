<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taller">
<meta name="theme-color" content="#14202b">
<title>Asistente de Taller</title>
<style>
:root{
  --bg:#e8ecef; --ink:#14202b; --card:#ffffff; --accent:#c98a00; --muted:#5b6b78;
  --user:#1d3a5a; --line:#cdd5db; --head:#14202b;
  --font:"Avenir Next","Helvetica Neue",system-ui,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519; --ink:#e6edf2; --card:#1a232a; --accent:#f0b429; --muted:#8fa1ae;
    --user:#2a4d73; --line:#2b3841; --head:#0a0f12;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
header{background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
header button{background:none;border:1px solid #ffffff44;color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.m{max-width:92%;padding:10px 14px;border-radius:14px;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--user);color:#fff;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--card);border-left:4px solid var(--accent);border-radius:4px 14px 14px 4px}
.m.a p{margin:0 0 8px}.m.a p:last-child{margin:0}
.m.a ul,.m.a ol{margin:4px 0 8px;padding-left:22px}
.m.a code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:.92em}
.m.err{border-left-color:#c0392b}
.vacio{margin:auto;max-width:420px;text-align:left}
.vacio h2{font-size:20px;margin:0 0 6px}
.vacio p{color:var(--muted);margin:0 0 14px}
.vacio button{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;font-size:15px}
form{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--card);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
#send{border:0;background:var(--accent);color:#14202b;font:inherit;font-weight:700;border-radius:12px;padding:0 18px}
#send:disabled{opacity:.5}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#ajustes{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:5}
#ajustes.on{display:flex}
.panel{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.panel h2{margin:0 0 12px;font-size:18px}
.panel label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.panel input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
.fila{display:flex;gap:8px;margin-top:16px}
.fila button{flex:1;border-radius:10px;padding:11px;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fila .ok{background:var(--accent);border-color:var(--accent);color:#14202b;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Asistente de Taller</h1>
  <button id="abrir" type="button">Ajustes</button>
</header>

<main id="msgs" aria-live="polite"></main>

<form id="f">
  <textarea id="t" rows="1" placeholder="Describe la avería o pregunta un dato técnico" aria-label="Mensaje"></textarea>
  <button id="send" type="submit">Enviar</button>
</form>

<div id="ajustes" role="dialog" aria-modal="true" aria-label="Ajustes">
  <div class="panel">
    <h2>Ajustes</h2>
    <label for="key">Clave de OpenRouter</label>
    <input id="key" type="password" autocomplete="off" placeholder="sk-or-...">
    <label for="modelo">Modelo</label>
    <input id="modelo" type="text" autocomplete="off">
    <div class="fila">
      <button id="borrar" type="button">Borrar chat</button>
      <button id="cerrar" type="button">Cerrar</button>
      <button id="guardar" type="button" class="ok">Guardar</button>
    </div>
  </div>
</div>

<script>
const SYSTEM = `Eres un asistente de mecánica y electromecánica automotriz para un taller multimarca. Respondes siempre en español, de forma clara y práctica, como un compañero con mucha experiencia.
- Para averías: pide marca, modelo, año y motor si faltan; luego da las causas por orden de probabilidad y los pasos de comprobación en orden lógico.
- Para códigos OBD2/DTC: explica qué significa, causas habituales y cómo verificarlas.
- Para datos técnicos (pares de apriete, capacidades, holguras, presiones): da el valor típico si lo conoces y avisa de que debe confirmarse en el manual del fabricante antes de aplicarlo. Si no lo sabes con seguridad, dilo, no inventes cifras.
- Avisa de los riesgos reales: sistemas de alta tensión en híbridos y eléctricos, airbags, combustible, elevación del vehículo.
- Sé breve; usa listas cortas cuando ayuden.`;

const EJEMPLOS = [
  "Código P0300 en un Volkswagen Golf 2015 1.6 TDI",
  "Par de apriete de la culata de un Ford Focus 1.6 TDCi",
  "La batería se descarga en una noche y el alternador carga bien"
];

const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

let historial = [];
try { historial = JSON.parse(store.get('historial', '[]')) || []; } catch(e){ historial = []; }
let ocupado = false;

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function md(texto){
  const lineas = esc(texto).split('\n');
  let html = '', lista = null;
  const cerrar = () => { if (lista){ html += '</' + lista + '>'; lista = null; } };
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  for (const l of lineas){
    let m;
    if ((m = l.match(/^\s*[-*]\s+(.*)/))){ if (lista !== 'ul'){ cerrar(); html += '<ul>'; lista = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if (lista !== 'ol'){ cerrar(); html += '<ol>'; lista = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; }
    else if (l.trim() === ''){ cerrar(); }
    else { cerrar(); html += '<p>' + inline(l) + '</p>'; }
  }
  cerrar();
  return html;
}

function pintar(){
  const cont = $('#msgs');
  cont.innerHTML = '';
  if (!historial.length){
    const v = document.createElement('div');
    v.className = 'vacio';
    v.innerHTML = '<h2>¿Qué tienes en el taller?</h2><p>Escribe la avería, el código o el dato que necesitas. Por ejemplo:</p>';
    EJEMPLOS.forEach(e => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = e;
      b.onclick = () => { $('#t').value = e; $('#t').focus(); };
      v.appendChild(b);
    });
    cont.appendChild(v);
    return;
  }
  historial.forEach(m => añadir(m.role === 'user' ? 'u' : 'a', m.content));
  cont.scrollTop = cont.scrollHeight;
}

function añadir(tipo, texto, extra){
  const d = document.createElement('div');
  d.className = 'm ' + tipo + (extra ? ' ' + extra : '');
  if (tipo === 'a') d.innerHTML = md(texto); else d.textContent = texto;
  $('#msgs').appendChild(d);
  $('#msgs').scrollTop = $('#msgs').scrollHeight;
  return d;
}

async function enviar(texto){
  const key = store.get('key', '');
  if (!key){ abrirAjustes(); return; }
  ocupado = true; $('#send').disabled = true;
  historial.push({ role: 'user', content: texto });
  pintar();
  const espera = añadir('a', 'Pensando…');
  try {
    const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: store.get('modelo', 'anthropic/claude-sonnet-4.5'),
        messages: [{ role: 'system', content: SYSTEM }, ...historial.slice(-20)]
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error((data.error && data.error.message) || ('Error ' + r.status));
    const resp = data.choices[0].message.content;
    historial.push({ role: 'assistant', content: resp });
    store.set('historial', JSON.stringify(historial));
    pintar();
  } catch (e){
    historial.pop();
    espera.className = 'm a err';
    espera.textContent = 'No se pudo obtener respuesta: ' + e.message + '. Revisa la clave y el modelo en Ajustes.';
  }
  ocupado = false; $('#send').disabled = false;
}

$('#f').addEventListener('submit', e => {
  e.preventDefault();
  const t = $('#t').value.trim();
  if (!t || ocupado) return;
  $('#t').value = ''; $('#t').style.height = 'auto';
  enviar(t);
});
$('#t').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
});

function abrirAjustes(){
  $('#key').value = store.get('key', '');
  $('#modelo').value = store.get('modelo', 'anthropic/claude-sonnet-4.5');
  $('#ajustes').classList.add('on');
}
$('#abrir').onclick = abrirAjustes;
$('#cerrar').onclick = () => $('#ajustes').classList.remove('on');
$('#guardar').onclick = () => {
  store.set('key', $('#key').value.trim());
  store.set('modelo', $('#modelo').value.trim() || 'anthropic/claude-sonnet-4.5');
  $('#ajustes').classList.remove('on');
};
$('#borrar').onclick = () => {
  historial = []; store.set('historial', '[]');
  $('#ajustes').classList.remove('on'); pintar();
};

pintar();
</script>
</body>
</html>
